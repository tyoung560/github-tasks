# Publishes the app to GitHub Pages on every push to main, and on demand from
# the Actions tab.
#
# No repository settings need touching first — the job points Pages at the
# Actions builder itself.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # A README-only change does not alter the bundle, so skip the deploy.
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages serves the app from /<repo>/, so the bundle has to be built
      # with that base path baked in.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Pages defaults to the legacy branch builder, which serves the repo
      # source — an unbuilt index.html whose only script is /src/main.tsx — so
      # the site loads blank. configure-pages only sets build_type when it
      # creates the site, and will not convert an existing branch-built one, so
      # set it explicitly here. Idempotent: PUT updates, POST creates.
      - name: Point Pages at the Actions builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --silent 2>/dev/null; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
